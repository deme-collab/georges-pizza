<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>George's Tap Order — PILOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     TAP-TO-BUILD ORDER — ISOLATED PILOT (steaks/pizza/appetizers)
     - Standalone, not linked from the site. Plain JS, no React/Babel.
     - NEVER computes prices itself: emits a `parsed` object and asks the
       backend /price endpoint to price it. Prices always from the engine.
     - "Send" is STUBBED to screen — does NOT print or create a real order.
     - Designed for 50+ users: large tiles, large type, high contrast.
     ========================================================================= */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --red: #c1272d; --red-dark: #9e1f24; --ink: #1a1a1a; --muted: #666;
    --line: #ddd; --bg: #f4f4f4; --green: #1e8f4e; --tile: #fff;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Oswald', 'Arial Narrow', sans-serif; background: var(--bg);
    color: var(--ink); font-size: 20px; -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; cursor: pointer; border: none; }

  /* ---- PIN screen ---- */
  .pin-screen {
    position: fixed; inset: 0; background: var(--ink); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; z-index: 100;
  }
  .pin-screen h1 { font-size: 44px; font-weight: 700; letter-spacing: 1px; }
  .pin-screen p { font-size: 22px; color: #bbb; }
  .pin-input {
    font-family: inherit; font-size: 40px; text-align: center; letter-spacing: 10px;
    width: 260px; padding: 16px; border-radius: 12px; border: 3px solid #555; background: #222; color: #fff;
  }
  .pin-btn {
    font-size: 26px; font-weight: 600; background: var(--red); color: #fff;
    padding: 18px 60px; border-radius: 12px; min-width: 260px;
  }
  .pin-btn:disabled { opacity: .5; }
  .pin-error { color: #ff8080; font-size: 20px; min-height: 24px; }

  /* ---- App shell ---- */
  #app { display: none; height: 100vh; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr; }
  #app.active { display: grid; }
  header {
    grid-column: 1 / 3; background: var(--red); color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .title { font-size: 30px; font-weight: 700; }
  header .pilot { font-size: 15px; background: #fff; color: var(--red-dark); padding: 5px 12px; border-radius: 20px; font-weight: 600; letter-spacing: .5px; }

  /* ---- Menu column ---- */
  .menu-col { grid-row: 2; overflow: hidden; display: flex; flex-direction: column; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px 6px; flex: 0 0 auto; }
  .tab {
    font-size: 19px; font-weight: 600; padding: 12px 18px; border-radius: 10px;
    background: #e2e2e2; color: #444;
  }
  .tab.active { background: var(--ink); color: #fff; }
  .items { flex: 1; overflow-y: auto; padding: 16px 20px 40px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; align-content: start; }
  .tile {
    background: var(--tile); border: 2px solid var(--line); border-radius: 14px;
    min-height: 120px; padding: 16px 14px; display: flex; flex-direction: column; justify-content: space-between;
    text-align: left; transition: transform .05s;
  }
  .tile:active { transform: scale(.97); border-color: var(--red); }
  .tile .name { font-size: 22px; font-weight: 600; line-height: 1.15; }
  .tile .price { font-size: 19px; color: var(--muted); margin-top: 8px; }

  /* ---- Cart column ---- */
  .cart-col { grid-row: 2; background: #fff; border-left: 2px solid var(--line); display: flex; flex-direction: column; }
  .cart-head { padding: 16px 20px 10px; font-size: 24px; font-weight: 700; }
  .order-meta { padding: 0 20px 12px; border-bottom: 2px solid var(--line); }
  .seg { display: flex; gap: 8px; margin-bottom: 8px; }
  .seg-btn { flex: 1; font-size: 19px; font-weight: 600; padding: 13px; border-radius: 10px; background: #e2e2e2; color: #444; }
  .seg-btn.active { background: var(--red); color: #fff; }
  .del-input { width: 100%; font-family: inherit; font-size: 19px; padding: 13px 14px; border: 2px solid var(--line); border-radius: 10px; margin-top: 8px; }
  .del-input:focus { outline: none; border-color: var(--red); }
  .cart-items { flex: 1; overflow-y: auto; padding: 8px 0; }
  .cart-empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 20px; }
  .cart-line { padding: 12px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .cart-line .ci-name { font-size: 20px; font-weight: 600; }
  .cart-line .ci-mods { font-size: 16px; color: var(--muted); margin-top: 3px; }
  .cart-line .ci-price { font-size: 20px; font-weight: 600; white-space: nowrap; }
  .ci-remove { background: none; color: var(--red); font-size: 15px; margin-top: 4px; text-decoration: underline; padding: 4px 0; }
  .totals { border-top: 2px solid var(--line); padding: 14px 20px; font-size: 20px; }
  .totals .row { display: flex; justify-content: space-between; margin: 4px 0; }
  .totals .grand { font-size: 30px; font-weight: 700; color: var(--green); margin-top: 6px; }
  .cart-actions { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .btn-primary { background: var(--green); color: #fff; font-size: 24px; font-weight: 600; padding: 20px; border-radius: 12px; }
  .btn-secondary { background: #e2e2e2; color: #333; font-size: 20px; font-weight: 600; padding: 16px; border-radius: 12px; }
  .btn-primary:disabled { opacity: .45; }

  /* ---- Modal ---- */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-bg.active { display: flex; }
  .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 720px; max-height: 92vh; display: flex; flex-direction: column; }
  .modal-head { padding: 20px 24px; border-bottom: 2px solid var(--line); font-size: 30px; font-weight: 700; }
  .modal-body { overflow-y: auto; padding: 12px 24px; }
  .mgroup { margin: 18px 0; }
  .mgroup h3 { font-size: 22px; font-weight: 600; margin-bottom: 10px; color: var(--red-dark); }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .opt {
    border: 2px solid var(--line); border-radius: 12px; padding: 16px 14px; font-size: 20px;
    background: #fff; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .opt.sel { border-color: var(--green); background: #eafaf0; font-weight: 600; }
  .opt .op-price { font-size: 17px; color: var(--muted); }
  .qty-row { display: flex; align-items: center; gap: 18px; margin: 18px 0 6px; }
  .qty-row h3 { font-size: 22px; font-weight: 600; color: var(--red-dark); }
  .qbtn { width: 60px; height: 60px; font-size: 34px; font-weight: 700; background: #e2e2e2; border-radius: 12px; }
  .qval { font-size: 30px; font-weight: 700; min-width: 40px; text-align: center; }
  .modal-foot { padding: 16px 24px; border-top: 2px solid var(--line); display: flex; gap: 12px; }
  .modal-foot button { flex: 1; font-size: 24px; font-weight: 600; padding: 18px; border-radius: 12px; }
  .m-cancel { background: #e2e2e2; color: #333; }
  .m-add { background: var(--green); color: #fff; }
  .m-add:disabled { opacity: .45; }
  .hint { font-size: 17px; color: var(--red); margin-top: 6px; }

  /* ---- Ticket (stub) overlay ---- */
  .ticket-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .ticket-bg.active { display: flex; }
  .ticket { background: #fff; border-radius: 16px; max-width: 460px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .ticket .th { background: var(--ink); color: #fff; padding: 16px 20px; font-size: 24px; font-weight: 700; text-align: center; border-radius: 16px 16px 0 0; }
  .ticket .stub-note { background: #fff3cd; color: #7a5b00; padding: 10px 20px; font-size: 16px; text-align: center; }
  .ticket .tbody { padding: 16px 22px; font-size: 19px; }
  .ticket .tline { padding: 8px 0; border-bottom: 1px dashed #ccc; }
  .ticket .tt { font-weight: 700; font-size: 24px; text-align: right; padding: 14px 22px; }
  .ticket .tclose { margin: 0 22px 22px; }
  .spinner { display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- PIN -->
<div class="pin-screen" id="pinScreen">
  <h1>George's Tap Order</h1>
  <p>Enter staff PIN</p>
  <input class="pin-input" id="pinInput" type="tel" inputmode="numeric" maxlength="8" autocomplete="off">
  <div class="pin-error" id="pinError"></div>
  <button class="pin-btn" id="pinBtn" onclick="verifyPin()">ENTER</button>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="title">George's Tap Order</div>
    <div class="pilot">PILOT · not a live order</div>
  </header>

  <div class="menu-col">
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items"></div>
  </div>

  <div class="cart-col">
    <div class="cart-head">Order</div>
    <div class="order-meta">
      <div class="seg">
        <button class="seg-btn active" id="typePickup" onclick="setType('to_go')">Pickup</button>
        <button class="seg-btn" id="typeDelivery" onclick="setType('delivery')">Delivery</button>
      </div>
      <div id="pickupFields">
        <input class="del-input" id="custName" placeholder="Name (optional)" autocomplete="off">
      </div>
      <div id="deliveryFields" style="display:none;">
        <div class="seg">
          <button class="seg-btn active" id="payCash" onclick="setPay('cash')">Cash</button>
          <button class="seg-btn" id="payCard" onclick="setPay('card')">Card</button>
        </div>
        <input class="del-input" id="delAddress" placeholder="Delivery address" autocomplete="off" oninput="updateSendState()">
        <input class="del-input" id="delPhone" type="tel" inputmode="tel" placeholder="Phone number" autocomplete="off">
      </div>
    </div>
    <div class="cart-items" id="cartItems"><div class="cart-empty">Tap an item to start</div></div>
    <div class="totals" id="totals" style="display:none;"></div>
    <div class="cart-actions">
      <button class="btn-primary" id="sendBtn" onclick="showTicket()" disabled>Review &amp; Print</button>
      <button class="btn-secondary" onclick="newOrder()">Clear Order</button>
    </div>
  </div>
</div>

<!-- Item modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="m-cancel" onclick="closeModal()">Cancel</button>
      <button class="m-add" id="addBtn" onclick="addToCart()">Add to Order</button>
    </div>
  </div>
</div>

<!-- Ticket / Print -->
<div class="ticket-bg" id="ticketBg">
  <div class="ticket">
    <div class="th">Review Order</div>
    <div class="tbody" id="ticketBody"></div>
    <div class="tt" id="ticketTotal"></div>
    <div style="padding:0 22px 22px; display:flex; gap:10px;">
      <button class="btn-secondary" style="flex:1;" onclick="closeTicket()">Back</button>
      <button class="btn-primary" style="flex:1;" id="printBtn" onclick="sendPrint()">🖨️ Print</button>
    </div>
  </div>
</div>

<script>

let cart = [];

async function verifyPin() {
  const pin = document.getElementById('pinInput').value.trim();
  const err = document.getElementById('pinError');
  if (!pin) { err.textContent = 'Please enter PIN'; return; }
  const btn = document.getElementById('pinBtn'); btn.disabled = true; btn.textContent = 'Checking...';
  try {
    const r = await fetch(`${API_URL}/api/internal/quick-order/verify-pin`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pin }) });
    const d = await r.json();
    if (d.success) { currentPin = pin; document.getElementById('pinScreen').style.display='none';
      document.getElementById('app').classList.add('active'); initTabs(); }
    else { err.textContent = d.error || 'Invalid PIN'; document.getElementById('pinInput').value=''; }
  } catch(e) { err.textContent = 'Connection error. Try again.'; }
  btn.disabled = false; btn.textContent = 'ENTER';
}
document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key==='Enter') verifyPin(); });

let activeTab = 'pizza';
function initTabs() {
  const tabs = document.getElementById('tabs'); tabs.innerHTML = '';
  Object.keys(MENU).forEach(key => {
    const b = document.createElement('button');
    b.className = 'tab' + (key===activeTab ? ' active' : '');
    b.textContent = MENU[key].label; b.onclick = () => { activeTab = key; initTabs(); renderItems(); };
    tabs.appendChild(b);
  });
  renderItems();
}
function renderItems() {
  const box = document.getElementById('items'); box.innerHTML = '';
  MENU[activeTab].items.forEach(it => {
    const t = document.createElement('button'); t.className = 'tile';
    const blocked = it.noDelivery && orderType === 'delivery';
    let priceLabel = '';
    if (blocked) priceLabel = 'pickup only';
    else if (it.price != null) priceLabel = '$' + it.price;
    else if (it.sizes) priceLabel = 'choose size';
    else if (MENU[activeTab].sizeRequired) priceLabel = 'choose size';
    t.innerHTML = `<div class="name">${it.label || it.name}</div><div class="price">${priceLabel}</div>`;
    if (blocked) { t.style.opacity = '0.4'; t.disabled = true; }
    else t.onclick = () => openItem(it);
    box.appendChild(t);
  });
}

function openItem(it) {
  const def = MENU[activeTab];
  const sizes = it.sizes || (def.sizeRequired ? def.sizes : null);
  const groups = it.groups || def.groups || [];
  modal = { def, item: it, cat: it.cat || def.cat, sizes, groups, size: null, single:{}, multi:{}, qty:1 };
  document.getElementById('modalTitle').textContent = it.name;
  const body = document.getElementById('modalBody'); body.innerHTML = '';

  if (sizes) {
    const g = document.createElement('div'); g.className='mgroup';
    g.innerHTML = `<h3>Size${' '}<span class="hint" id="sizeHint">— required</span></h3>`;
    const opts = document.createElement('div'); opts.className='opts';
    sizes.forEach(s => {
      const o = document.createElement('button'); o.className='opt';
      const sp = it.sizePrices && it.sizePrices[s.token];
      o.innerHTML = `<span>${s.label}</span>${sp!=null?`<span class="op-price">$${sp}</span>`:''}`;
      o.onclick = () => { modal.size = s.token; [...opts.children].forEach(c=>c.classList.remove('sel')); o.classList.add('sel');
        const h=document.getElementById('sizeHint'); if(h) h.remove(); refreshAdd(); };
      opts.appendChild(o);
    });
    g.appendChild(opts); body.appendChild(g);
  }

  groups.forEach((grp, gi) => {
    const g = document.createElement('div'); g.className='mgroup';
    g.innerHTML = `<h3>${grp.label}</h3>`;
    const opts = document.createElement('div'); opts.className='opts';
    grp.options.forEach(op => {
      const o = document.createElement('button'); o.className='opt';
      o.innerHTML = `<span>${op.label}</span>${op.note?`<span class="op-price">${op.note}</span>`:''}`;
      o.onclick = () => {
        if (grp.type==='single') {
          [...opts.children].forEach(c=>c.classList.remove('sel')); o.classList.add('sel'); modal.single[gi]=op.token; refreshAdd();
        } else {
          if (!modal.multi[gi]) modal.multi[gi] = new Set();
          const set = modal.multi[gi];
          if (set.has(op.token)) { set.delete(op.token); o.classList.remove('sel'); }
          else { set.add(op.token); o.classList.add('sel'); }
        }
      };
      opts.appendChild(o);
    });
    // preselect a single-group default (e.g. lunch drink = Can Soda)
    if (grp.type==='single' && grp.default != null) {
      modal.single[gi] = grp.default;
      grp.options.forEach((op, oi) => { if (op.token === grp.default) opts.children[oi].classList.add('sel'); });
    }
    g.appendChild(opts); body.appendChild(g);
  });

  // qty stepper
  const q = document.createElement('div'); q.className='qty-row';
  q.innerHTML = `<h3>Qty</h3><button class="qbtn" onclick="bumpQty(-1)">–</button><span class="qval" id="qval">1</span><button class="qbtn" onclick="bumpQty(1)">+</button>`;
  body.appendChild(q);

  document.getElementById('modalBg').classList.add('active');
  refreshAdd();
}
function bumpQty(d){ modal.qty = Math.max(1, Math.min(20, modal.qty + d)); document.getElementById('qval').textContent = modal.qty; }
function refreshAdd(){
  let blocked = !!(modal.sizes && !modal.size);
  modal.groups.forEach((grp, gi) => { if (grp.required && !modal.single[gi]) blocked = true; });
  document.getElementById('addBtn').disabled = blocked;
}
function closeModal(){ document.getElementById('modalBg').classList.remove('active'); modal=null; }

function addToCart() {
  if (!modal) return;
  const buckets = { main: [], fries: [], drink: [] };
  const halves = {};
  modal.groups.forEach((grp, gi) => {
    const bucket = grp.bucket || 'main';
    if (bucket === 'half1' || bucket === 'half2') { const t = modal.single[gi]; if (t) halves[bucket] = t; return; }
    if (grp.type === 'single') { const t = modal.single[gi]; if (t) buckets[bucket].push(t); }
    else { (modal.multi[gi] || new Set()).forEach(t => buckets[bucket].push(t)); }
  });
  const label = halves.half1 ? `Half ${halves.half1} / Half ${halves.half2}` : (modal.item.label || modal.item.name);
  cart.push({ category: modal.cat, item: modal.item.name, size: modal.size || null,
    half1: halves.half1 || null, half2: halves.half2 || null,
    mods: buckets, qty: modal.qty, _label: label, _sizeLabel: sizeLabel(modal) });
  closeModal(); renderCart();
}
function sizeLabel(m){ if(!m.size) return ''; const s=(m.sizes||[]).find(x=>x.token===m.size); return s?s.label:''; }

function renderCart() {
  const box = document.getElementById('cartItems');
  if (!cart.length) {
    box.innerHTML = '<div class="cart-empty">Tap an item to start</div>';
  } else {
    box.innerHTML = '';
    cart.forEach((c, i) => {
      const mods = [...(c.mods.main||[]), ...(c.mods.fries||[]), ...(c.mods.drink||[])].map(prettyTok).filter(Boolean).join(', ');
      const line = document.createElement('div'); line.className='cart-line';
      line.innerHTML = `<div><div class="ci-name">${c.qty>1?c.qty+'× ':''}${c._sizeLabel?c._sizeLabel+' ':''}${c._label}</div>${mods?`<div class="ci-mods">${mods}</div>`:''}<button class="ci-remove" onclick="removeLine(${i})">remove</button></div><div class="ci-price" id="price-${i}">…</div>`;
      box.appendChild(line);
    });
  }
  reprice(); // live-price the whole order after any change
}
function prettyTok(t){ return t ? t.replace(/_/g,' ').replace(/\b\w/g, m=>m.toUpperCase()) : ''; }
function removeLine(i){ cart.splice(i,1); renderCart(); }

// Re-price the entire cart through the engine after every add/remove so the
// running total + per-line prices update live. Prices ALWAYS come from the
// server — the UI never computes them itself.
async function reprice() {
  const totals = document.getElementById('totals');
  if (!cart.length) { totals.style.display='none'; lastPricedOrder=null; updateSendState(); return; }
  const parsed = { items: cart.map(c => { const it = { category:c.category, item:c.item, size:c.size, mods:c.mods, qty:c.qty };
    if (c.half1) { it.half1 = c.half1; it.half2 = c.half2; } return it; }),
    orderType: orderType, paymentType: payType };
  if (orderType === 'delivery') parsed.delivery = {
    address: (document.getElementById('delAddress').value || '').trim(),
    phone: (document.getElementById('delPhone').value || '').trim() };
  try {
    const r = await fetch(`${API_URL}/api/internal/quick-order/price`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pin: currentPin, parsed }) });
    const d = await r.json();
    const order = d.order || d;
    if (order && order.items) {
      lastPricedOrder = order;
      order.items.forEach((it, i) => { const el = document.getElementById('price-'+i); if (el) el.textContent = '$' + (it.price||0).toFixed(2); });
      totals.style.display='block';
      totals.innerHTML =
        `<div class="row"><span>Subtotal</span><span>$${(order.subtotal||0).toFixed(2)}</span></div>`+
        (order.deliveryFee ? `<div class="row"><span>Delivery</span><span>$${Number(order.deliveryFee).toFixed(2)}</span></div>` : '')+
        (order.cardFee ? `<div class="row"><span>Card fee</span><span>$${Number(order.cardFee).toFixed(2)}</span></div>` : '')+
        `<div class="row"><span>Tax</span><span>$${(order.tax||0).toFixed(2)}</span></div>`+
        `<div class="row grand"><span>Total</span><span>$${(order.total||0).toFixed(2)}</span></div>`;
    }
  } catch(e) { /* keep last shown prices on a transient error */ }
  updateSendState();
}

function setType(t) {
  orderType = t;
  document.getElementById('typePickup').classList.toggle('active', t==='to_go');
  document.getElementById('typeDelivery').classList.toggle('active', t==='delivery');
  document.getElementById('deliveryFields').style.display = t==='delivery' ? 'block' : 'none';
  document.getElementById('pickupFields').style.display = t==='delivery' ? 'none' : 'block';
  renderItems(); // reflect pickup-only items (e.g. Ice Cream Cone) for the current mode
  reprice();
}
function setPay(p) {
  payType = p;
  document.getElementById('payCash').classList.toggle('active', p==='cash');
  document.getElementById('payCard').classList.toggle('active', p==='card');
  reprice();
}
// Send is enabled only with priced items, and (for delivery) a non-empty address.
function updateSendState() {
  const sendBtn = document.getElementById('sendBtn');
  const hasItems = !!(lastPricedOrder && cart.length);
  const needAddr = orderType==='delivery' && !(document.getElementById('delAddress').value || '').trim();
  sendBtn.disabled = !hasItems || needAddr;
}

function showTicket() {
  const order = lastPricedOrder; if (!order) return;
  const isDel = order.orderType === 'delivery' || !!order.delivery;
  const pay = (order.paymentType || payType) === 'card' ? 'CARD' : 'CASH';
  const name = (document.getElementById('custName').value || '').trim();
  const b = document.getElementById('ticketBody');
  let head = `<div class="tline" style="font-weight:700;font-size:22px;text-align:center;">${isDel?'&gt;&gt;&gt; DELIVERY &lt;&lt;&lt;':'&gt;&gt;&gt; PICKUP &lt;&lt;&lt;'}${isDel?' &middot; '+pay:''}</div>`;
  if (isDel) head += `<div class="tline" style="text-align:center;color:#7a5b00;font-size:15px;">prints 2 slips: kitchen + driver</div>`;
  if (!isDel && name) head += `<div class="tline" style="text-align:center;font-weight:700;">${name.toUpperCase()}</div>`;
  if (isDel && order.delivery) head += `<div class="tline"><b>${(order.delivery.address||'').toUpperCase()}</b>${order.delivery.phone?'<br>Phone: '+order.delivery.phone:''}</div>`;
  const lines = order.items.map(i => {
    const main = (Array.isArray(i.mods) ? i.mods : []).filter(Boolean);
    let sub = main.length ? `<br><span style="color:#666;font-size:16px">${main.join(', ')}</span>` : '';
    if (i.specialMods) {
      if (i.specialMods.fries && i.specialMods.fries.length) sub += `<br><span style="color:#666;font-size:16px">Side: ${i.specialMods.fries.join(', ')}</span>`;
      if (i.specialMods.drink && i.specialMods.drink.length) sub += `<br><span style="color:#666;font-size:16px">Drink: ${i.specialMods.drink.join(', ')}</span>`;
    }
    return `<div class="tline"><b>${i.quantity>1?i.quantity+'× ':''}${i.name}</b> — $${(i.price||0).toFixed(2)}${sub}</div>`;
  }).join('');
  let fees = '';
  if (order.deliveryFee) fees += `<div class="tline">Delivery Fee — $${Number(order.deliveryFee).toFixed(2)}</div>`;
  if (order.cardFee) fees += `<div class="tline">Card Fee — $${Number(order.cardFee).toFixed(2)}</div>`;
  b.innerHTML = head + lines + fees;
  document.getElementById('ticketTotal').textContent = 'TOTAL  $' + (order.total||0).toFixed(2);
  document.getElementById('ticketBg').classList.add('active');
}
function closeTicket(){ document.getElementById('ticketBg').classList.remove('active'); }

// Real print: send the priced order (+ pickup name) to /print → kitchen ticket.
async function sendPrint() {
  if (!lastPricedOrder) return;
  const btn = document.getElementById('printBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Printing...';
  const order = { ...lastPricedOrder };
  const name = (document.getElementById('custName').value || '').trim();
  if (orderType !== 'delivery' && name) order.customerName = name;
  try {
    const r = await fetch(`${API_URL}/api/internal/quick-order/print`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pin: currentPin, order }) });
    const d = await r.json();
    if (d.success) {
      closeTicket();
      alert((d.demo ? 'DEMO — not actually printed\n' : '✓ Printed!  ') + 'Order #' + (d.orderNumber || ''));
      newOrder();
    } else { alert('Print failed: ' + (d.error || 'unknown')); }
  } catch(e) { alert('Connection error. Try again.'); }
  btn.disabled=false; btn.innerHTML='🖨️ Print';
}

function newOrder(){
  cart = [];
  const a = document.getElementById('delAddress'); if (a) a.value = '';
  const p = document.getElementById('delPhone'); if (p) p.value = '';
  const n = document.getElementById('custName'); if (n) n.value = '';
  setPay('cash');
  setType('to_go'); // resets pickup + hides delivery fields
  renderCart();
}
</script>
</body>
</html>
